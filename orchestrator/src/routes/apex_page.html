<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Welcome to L8Bin (litebin)</title>
    <style>
      :root {
        --bg: #0a0c10;
        --card: #10141b;
        --border: #1c222d;
        --text: #c9d1d9;
        --dim: #5c6672;
        --accent: #8b5cf6;
        --green: #3fb950;
        --yellow: #d29922;
        --red: #f85149;
        --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 44px 44px;
        opacity: 0.18;
        pointer-events: none;
      }
      .page {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
        min-height: 100dvh;
        padding: 2rem;
        position: relative;
        animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .domain {
        display: flex;
        align-items: baseline;
        gap: 0.4em;
        font-size: clamp(1.6rem, 5vw, 3rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text);
      }
      .mark {
        width: 0.62em;
        height: 0.62em;
        align-self: flex-end;
        transform: translateY(-0.14em);
        color: var(--accent);
      }
      .terminal {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .term-bar {
        display: flex;
        justify-content: flex-end;
        gap: 7px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
      }
      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .dot.red {
        background: var(--red);
      }
      .dot.yellow {
        background: var(--yellow);
      }
      .dot.green {
        background: var(--green);
      }
      .term-body {
        padding: 18px 18px 20px;
        font-size: 0.85rem;
        line-height: 1.75;
      }
      .prompt {
        color: var(--accent);
        margin-right: 0.6em;
      }
      .output {
        color: var(--dim);
        padding-left: 1.15em;
      }
      .output a {
        color: var(--accent);
        text-decoration: none;
      }
      .output a:hover {
        text-decoration: underline;
      }
      .cursor {
        display: inline-block;
        width: 0.55em;
        height: 1.05em;
        background: var(--text);
        vertical-align: text-bottom;
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .footer {
        position: absolute;
        bottom: 1.25rem;
        color: var(--dim);
        font-size: 0.75rem;
      }
      .footer a {
        color: var(--dim);
        text-decoration: none;
        border-bottom: 1px dotted var(--dim);
        transition: color 0.15s;
      }
      .footer a:hover {
        color: var(--text);
        border-bottom-color: var(--text);
      }
      @media (max-height: 560px) {
        .page {
          gap: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1 class="domain">
        <span id="domain">example.com</span>
        <svg class="mark" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="4 17 10 11 4 5" />
          <line x1="12" x2="20" y1="19" y2="19" />
        </svg>
      </h1>

      <div class="terminal" aria-hidden="true">
        <div class="term-bar">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div class="term-body">
          <div class="line"><span class="prompt">$</span>curl https://<span id="term-domain">example.com</span></div>
          <div class="line output">L8Bin (litebin) is up and running.</div>
          <div class="line output">Quickstart guide: <a href="https://l8bin.com/quickstart">l8bin.com/quickstart</a></div>
          <div class="line output">Latest docs: <a href="https://l8bin.com/docs">l8bin.com/docs</a></div>
          <div class="line"><span class="prompt">$</span>&nbsp;<span class="cursor"></span></div>
        </div>
      </div>

      <div class="footer">
        Powered by <a href="https://l8bin.com">L8Bin.com</a>
      </div>
    </main>
    <script>
      const host = window.location.hostname || 'example.com';
      // sslip/nip hosts show the IP as the title; everything else the hostname.
      const m = host.match(/^((?:\d+-){3}\d+)\.(?:sslip\.io|nip\.io)$/);
      const display = m ? m[1].replace(/-/g, '.') : host;
      document.getElementById('domain').textContent = display;
      document.getElementById('term-domain').textContent = host;
      document.title = `${display} | Welcome to L8Bin (litebin)`;
    </script>
  </body>
</html>

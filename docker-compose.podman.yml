# Podman runtime override: run the master stack on a podman node (CRIU
# checkpoint/restore sleep). See docs/topics/podman-nodes.md.
#
# Usage (from the repo root, with docker-compose or docker compose):
#   DOCKER_HOST=unix:///run/podman/podman.sock docker-compose \
#     -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.podman.yml \
#     --profile master up -d --build
services:
  orchestrator:
    volumes:
      # Replaces the Docker socket with podman's (compose merges by target path).
      - /run/podman/podman.sock:/var/run/docker.sock
    environment:
      - CONTAINER_RUNTIME=podman
      # Same mounted socket serves both the compat API (bollard) and the
      # native libpod API (checkpoint/restore) inside the container.
      - PODMAN_SOCKET=/var/run/docker.sock

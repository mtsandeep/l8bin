name: Deploy Landing Page

on:
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --pattern 'openapi.json' --output docs/openapi.json --clobber
          gh release download --pattern 'cli-reference.md' --output docs/reference/cli-reference.md --clobber
          gh release download --pattern 'llms-full.txt' --output llms-full.txt --clobber

      - name: Copy docs into landing
        run: |
          rm -rf landing/public/docs/guides
          mkdir -p landing/public/docs/guides
          cp docs/openapi.json landing/public/docs/openapi.json
          cp docs/reference/cli-reference.md landing/public/docs/guides/cli-reference.md
          cp docs/llms.txt landing/public/llms.txt
          cp llms-full.txt landing/public/llms-full.txt
          for f in topics/multi-service topics/multi-server topics/volumes topics/env-secrets topics/configuration topics/security topics/faq topics/backup topics/github-connect topics/ai-native architecture/architecture architecture/decisions architecture/failure-model architecture/user-flows architecture/scale-to-zero; do
            if [ -f "docs/${f}.md" ]; then
              cp "docs/${f}.md" "landing/public/docs/guides/$(basename ${f}).md"
            else
              echo "::error::docs/${f}.md not found — DOC_MAP expects it"
              exit 1
            fi
          done

      - uses: mtsandeep/l8bin-action@v0.2.1
        with:
          server: ${{ secrets.L8B_SERVER }}
          token: ${{ secrets.L8B_TOKEN }}
          project_id: landing
          port: '80'
          path: landing

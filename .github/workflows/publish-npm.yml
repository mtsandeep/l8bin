name: Publish npm shim

# Runs when the Release workflow completes. Releases created by that workflow
# use GITHUB_TOKEN, whose events don't trigger other workflows — so this
# chains on the run itself (workflow_run always fires). Auth is npm Trusted
# Publishing (OIDC — no token secret). Version is set by cargo release.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # The release commit, not whatever main has moved on to
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Verify package version matches the release tag
        id: version
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          VERSION="${HEAD_BRANCH#v}"
          if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            :
          elif echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-'; then
            # Prereleases never become /releases/latest, which is all the shim serves.
            echo "Prerelease '$VERSION' — skipping npm publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Ref '$HEAD_BRANCH' is not a semver tag (got '$VERSION'); refusing to publish"
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./npm/package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "npm/package.json says '$PKG_VERSION' but the release tag is '$VERSION' — releases must go through 'cargo release'"
            exit 1
          fi

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        working-directory: npm
        run: npm publish --access public --provenance

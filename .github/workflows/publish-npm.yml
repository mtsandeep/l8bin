name: Publish npm shim

# Publishes l8bin-mcp on every GitHub release via npm Trusted Publishing
# (OIDC — no token secret). Version is set by cargo release.
# Configure on npmjs.com: package settings → Trusted Publishing →
# repository mtsandeep/l8bin, workflow publish-npm.yml.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Verify package version matches the release tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            :
          elif echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-'; then
            # Prereleases never become /releases/latest, which is all the shim serves.
            echo "Prerelease '$VERSION' — skipping npm publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Ref '$GITHUB_REF_NAME' is not a semver tag (got '$VERSION'); refusing to publish"
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./npm/package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "npm/package.json says '$PKG_VERSION' but the release tag is '$VERSION' — releases must go through 'cargo release'"
            exit 1
          fi

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        working-directory: npm
        run: npm publish --access public --provenance
